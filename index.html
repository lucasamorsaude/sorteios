<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black November CDT e AS · Rifa Solidária</title>
    <meta name="description" content="Concorra a um kit de eletrodomésticos (batedeira, liquidificador, churrasqueira, ventilador e misteira) e ajude esta ação solidária.">
    <meta name="theme-color" content="#050505">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Black November CDT e AS · Rifa Solidária">
    <meta property="og:description" content="Concorra a um kit de eletrodomésticos: batedeira, liquidificador, churrasqueira, ventilador e misteira. Fale com um vendedor e participe!">
    <meta property="og:image" content="https://lucasamorsaude.github.io/Natal-Solidario/assets/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preload" as="image" href="assets/fundo-mobile.webp" media="(max-width: 767px)">
    <link rel="preload" as="image" href="assets/fundo.webp" media="(min-width: 768px)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <div class="faixa" aria-hidden="true"><div class="faixa-trilho" id="faixa"></div></div>
    <main class="page">
        <header class="hero">
            <p class="selo" id="selo"><b>Black November</b><i>Solidária</i></p>
            <h1 id="titulo">Black November CDT e AS</h1>
            <p class="chamada" id="chamada"></p>
        </header>

        <section class="card countdown" aria-labelledby="cd-titulo">
            <h2 id="cd-titulo">Faltam para o sorteio</h2>
            <div id="timer" class="timer" role="timer" aria-live="off">
                <div class="tb"><span id="days">--</span><small>dias</small></div>
                <div class="tb"><span id="hours">--</span><small>horas</small></div>
                <div class="tb"><span id="minutes">--</span><small>min</small></div>
                <div class="tb"><span id="seconds">--</span><small>seg</small></div>
            </div>
            <p class="data-sorteio" id="data-sorteio"></p>
            <div id="resultado" class="resultado" hidden></div>
        </section>

        <section class="card progresso" aria-labelledby="pg-titulo">
            <div class="pg-head">
                <h2 id="pg-titulo">Números escolhidos</h2>
                <span class="pg-num" id="pg-num">…</span>
            </div>
            <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Porcentagem de números escolhidos">
                <div class="bar-pago" id="bar-pago"></div>
                <div class="bar-metas" id="bar-metas"></div>
            </div>
            <p class="pg-msg" id="pg-msg">Carregando…</p>
            <div class="acoes">
                <button type="button" class="btn btn-claro" id="btn-consultar">Consultar meus números</button>
            </div>
        </section>

        <section class="premio" aria-labelledby="pr-titulo">
            <h2 id="pr-titulo">O prêmio</h2>
            <p class="sub" id="pr-sub"></p>
            <div class="itens" id="itens"></div>
        </section>

        <footer class="rodape">
            <p id="org"></p>
            <p><a id="zap-rodape" href="#" target="_blank" rel="noopener">Dúvidas? Fale no WhatsApp</a></p>
        </footer>
    </main>

    <!-- consulta -->
    <div class="modal" id="modal-consulta" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="mc-titulo">
            <button type="button" class="fechar" data-fechar aria-label="Fechar">&times;</button>
            <h2 id="mc-titulo">Consulte seus números</h2>
            <p class="sub">Use o e-mail <b>ou</b> o telefone e a data de nascimento informados no cadastro.</p>
            <form id="form-consulta" novalidate>
                <label class="campo">
                    <span>E-mail ou telefone (WhatsApp)</span>
                    <input type="text" id="consulta-contato" autocomplete="email" required placeholder="voce@email.com ou (32) 99999-9999">
                </label>
                <label class="campo">
                    <span>Data de nascimento</span>
                    <input type="date" id="consulta-nascimento" required>
                </label>
                <button type="submit" class="btn btn-ouro largo" id="btn-buscar">Buscar</button>
            </form>
            <div id="resultado-consulta" aria-live="polite"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="site.js"></script>
</body>
</html>
